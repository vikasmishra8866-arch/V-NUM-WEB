<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vahan Info Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        @keyframes floatOrbs { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .bg-orb { animation: floatOrbs 8s infinite ease-in-out; }
        .card-entrance { animation: fadeInUp 0.4s ease-out forwards; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .btn-glow:hover { box-shadow: 0 4px 14px rgba(37,99,235,0.25); transform: scale(1.02); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <!-- Background Orbs -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="bg-orb absolute top-10 left-10 w-72 h-72 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
        <div class="bg-orb absolute bottom-10 right-10 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>
    </div>

    <div class="glass-card w-full max-w-md p-6 rounded-3xl shadow-lg shadow-slate-200/50 card-entrance">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Vehicle Search</h1>
        <input type="text" id="vehInput" placeholder="Enter Registration No. (e.g. GJ05HG7801)" 
               class="w-full p-4 mb-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none uppercase"
               oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase()">
        <button id="searchBtn" onclick="fetchVehicle()" class="w-full h-12 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition btn-glow">
            Search Details
        </button>
        <div id="result" class="mt-6 hidden"></div>
    </div>

    <script>
        async function fetchVehicle() {
            const btn = document.getElementById('searchBtn');
            const vehNo = document.getElementById('vehInput').value;
            const resDiv = document.getElementById('result');
            
            if(!vehNo) return;

            btn.disabled = true;
            btn.innerText = "Wait 7s...";
            
            try {
                const response = await fetch(`/api/vahan?veh=${vehNo}`);
                const data = await response.json();
                
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `<pre class="text-xs bg-slate-100 p-4 rounded-lg text-slate-700 overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>`;
            } catch(e) {
                resDiv.innerHTML = `<p class="text-red-500">Error fetching data</p>`;
            }

            let countdown = 7;
            const timer = setInterval(() => {
                countdown--;
                if(countdown > 0) btn.innerText = `Wait ${countdown}s...`;
                else {
                    btn.disabled = false;
                    btn.innerText = "Search Details";
                    clearInterval(timer);
                }
            }, 1000);
        }
    </script>
</body>
</html>
